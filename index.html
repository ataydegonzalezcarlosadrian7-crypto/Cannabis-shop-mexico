<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CANNABIS SHOP | Premium High-End</title>
    
    <!-- Scripts de Estilo y Framework -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style type="text/tailwindcss">
        @layer base {
            body { 
                @apply bg-[#050505] text-zinc-100 antialiased; 
                font-family: 'Plus Jakarta Sans', sans-serif; 
            }
            .font-serif { font-family: 'Playfair Display', serif; }
        }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        .fade-in { animation: fadeIn 0.8s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

        .loader {
            border-top-color: #10b981;
            animation: spinner 0.8s linear infinite;
        }
        @keyframes spinner { to { transform: rotate(360deg); } }

        .btn-emerald {
            @apply bg-emerald-600 text-white px-8 py-4 text-[11px] uppercase font-black tracking-[0.3em] transition-all hover:bg-emerald-500 hover:shadow-[0_0_30px_rgba(16,185,129,0.3)] disabled:opacity-20;
        }

        .glass-card {
            @apply bg-zinc-900/40 backdrop-blur-xl border border-zinc-800/50 hover:border-emerald-500/50 transition-all duration-500;
        }

        .input-premium {
            @apply bg-zinc-900/50 border border-zinc-800 p-4 text-white outline-none focus:border-emerald-500 transition-all rounded-lg;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- CONFIGURACIÓN DE TU FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyABHxYWonX7uIN6duaY3-qZlz7nX84RSYU",
            authDomain: "cannabis-shop-mexico.firebaseapp.com",
            projectId: "cannabis-shop-mexico",
            storageBucket: "cannabis-shop-mexico.firebasestorage.app",
            messagingSenderId: "251411959127",
            appId: "1:251411959127:web:fe88bbcf333e7feb428212",
            measurementId: "G-DQ822CGPHL"
        };

        // Inicialización de Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        // --- CONFIGURACIÓN DE LA TIENDA ---
        const appId = "cannabis-shop-mexico"; 
        const ADMIN_PIN = "2024";
        const CATEGORIES = ["Todos", "Semillas de cannabis", "Indica", "Sativa", "Híbrida", "Comestibles", "Extractos"];
        const WHATSAPP_NUM = "5215648515663";
        
        // CORREO PAYPAL ACTUALIZADO
        const PAYPAL_USER = "santagonzalezmerino@gmail.com"; 
        const SHIPPING_COST = 150; 

        function App() {
            const [view, setView] = useState('home');
            const [products, setProducts] = useState([]);
            const [cart, setCart] = useState([]);
            const [loading, setLoading] = useState(true);
            const [isAdmin, setIsAdmin] = useState(false);
            const [activeCategory, setActiveCategory] = useState('Todos');
            const [notification, setNotification] = useState(null);
            const [showAdminModal, setShowAdminModal] = useState(false);
            const [isProcessing, setIsProcessing] = useState(false);
            const [includeShipping, setIncludeShipping] = useState(false);
            const [pinInput, setPinInput] = useState('');
            const [newProduct, setNewProduct] = useState({ name: '', price: '', category: 'Semillas de cannabis', image: '', description: '' });

            useEffect(() => {
                // Autenticación anónima para permitir lectura en GitHub Pages
                auth.signInAnonymously().catch(e => console.error("Error Auth:", e));

                const unsub = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('products')
                    .onSnapshot((snap) => {
                        const data = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                        setProducts(data);
                        setLoading(false);
                    }, (err) => {
                        console.error("Error cargando productos:", err);
                        setLoading(false);
                    });

                if (sessionStorage.getItem('shopAdminAuth') === 'true') setIsAdmin(true);
                return () => unsub();
            }, []);

            const notify = (msg) => {
                setNotification(msg);
                setTimeout(() => setNotification(null), 3000);
            };

            const subtotal = useMemo(() => cart.reduce((a, b) => a + b.price, 0), [cart]);
            const total = useMemo(() => subtotal + (includeShipping ? SHIPPING_COST : 0), [subtotal, includeShipping]);

            const filtered = useMemo(() => 
                activeCategory === 'Todos' ? products : products.filter(p => p.category === activeCategory)
            , [products, activeCategory]);

            // Función de Pago de PayPal
            const handlePayPalPayment = () => {
                if (cart.length === 0) return;
                const itemNames = cart.map(i => i.name).join(', ');
                const paypalUrl = `https://www.paypal.com/cgi-bin/webscr?cmd=_xclick&business=${encodeURIComponent(PAYPAL_USER)}&amount=${total}&currency_code=MXN&item_name=${encodeURIComponent('Pedido Cannabis Shop: ' + itemNames)}`;
                window.open(paypalUrl, '_blank');
            };

            const handleAdminLogin = (e) => {
                e.preventDefault();
                if (pinInput === ADMIN_PIN) {
                    setIsAdmin(true);
                    sessionStorage.setItem('shopAdminAuth', 'true');
                    setView('admin');
                    setPinInput('');
                    notify("Sesión iniciada");
                } else {
                    notify("PIN incorrecto");
                    setPinInput('');
                }
            };

            const handleImage = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const img = new Image();
                    img.src = ev.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_W = 600;
                        const scale = MAX_W / img.width;
                        canvas.width = MAX_W;
                        canvas.height = img.height * scale;
                        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                        setNewProduct({...newProduct, image: canvas.toDataURL('image/jpeg', 0.7)});
                    };
                };
                reader.readAsDataURL(file);
            };

            const saveProduct = async (e) => {
                e.preventDefault();
                if (isProcessing || !newProduct.image) return;
                setIsProcessing(true);
                try {
                    await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('products').add({
                        ...newProduct,
                        price: Number(newProduct.price),
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    setNewProduct({ name: '', price: '', category: 'Semillas de cannabis', image: '', description: '' });
                    setShowAdminModal(false);
                    notify("Variedad publicada");
                } catch (err) {
                    notify("Error al publicar");
                } finally {
                    setIsProcessing(false);
                }
            };

            if (loading) return (
                <div className="h-screen flex flex-col items-center justify-center bg-[#020202]">
                    <div className="w-16 h-16 border-t-4 border-emerald-500 loader rounded-full"></div>
                </div>
            );

            return (
                <div className="min-h-screen">
                    {/* Header */}
                    <nav className="fixed top-0 w-full z-50 bg-black/80 backdrop-blur-2xl px-6 md:px-12 h-20 flex justify-between items-center border-b border-white/5">
                        <div className="flex items-center gap-8">
                            <button onClick={() => isAdmin ? setView('admin') : setView('login')} className="opacity-10 hover:opacity-100 transition-opacity p-2">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#10b981" strokeWidth="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                            </button>
                            <h1 onClick={() => setView('home')} className="font-serif text-2xl md:text-3xl font-bold tracking-tighter cursor-pointer text-white italic uppercase">CANNABIS<span className="text-emerald-500">SHOP</span></h1>
                        </div>
                        <div className="flex items-center gap-6">
                            <button onClick={() => setView('shop')} className="text-[10px] uppercase font-black tracking-widest hidden md:block text-zinc-400 hover:text-emerald-500">Catálogo</button>
                            <button onClick={() => setView('cart')} className="relative group bg-emerald-500/10 p-3 rounded-full border border-emerald-500/20">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#10b981" strokeWidth="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
                                {cart.length > 0 && (
                                    <span className="absolute -top-1 -right-1 bg-white text-emerald-600 text-[9px] w-5 h-5 rounded-full flex items-center justify-center font-black">{cart.length}</span>
                                )}
                            </button>
                        </div>
                    </nav>

                    <main className="pt-20">
                        {view === 'home' && (
                            <section className="relative h-[90vh] flex flex-col items-center justify-center text-center px-6 overflow-hidden">
                                <div className="absolute inset-0 z-0 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-emerald-900/10 via-transparent to-transparent"></div>
                                <div className="relative z-10 space-y-10 fade-in max-w-5xl">
                                    <div className="inline-block px-4 py-1 rounded-full border border-emerald-500/30 bg-emerald-500/5">
                                        <span className="text-[9px] uppercase tracking-[0.4em] font-black text-emerald-400">Pureza • Discreción • Calidad</span>
                                    </div>
                                    <h2 className="text-7xl md:text-[10rem] font-serif italic font-bold tracking-tighter leading-[0.85] text-white uppercase tracking-tighter">THE HIGH <br/> <span className="text-emerald-500">SOCIETY</span></h2>
                                    <button onClick={() => setView('shop')} className="btn-emerald px-16 py-6 shadow-2xl mt-10">Explorar Selección</button>
                                </div>
                            </section>
                        )}

                        {view === 'shop' && (
                            <div className="max-w-7xl mx-auto px-6 py-16">
                                <header className="mb-16 flex flex-col md:flex-row justify-between items-center gap-10">
                                    <h2 className="text-6xl font-serif italic tracking-tighter text-white">Menú</h2>
                                    <div className="flex gap-2 overflow-x-auto pb-4 no-scrollbar max-w-full">
                                        {CATEGORIES.map(c => (
                                            <button key={c} onClick={() => setActiveCategory(c)} className={`text-[9px] uppercase font-black tracking-widest px-6 py-3 rounded-xl transition-all border ${activeCategory === c ? 'bg-emerald-600 text-white border-emerald-500' : 'bg-zinc-900/50 text-zinc-500 border-zinc-800 hover:text-emerald-400'}`}>
                                                {c}
                                            </button>
                                        ))}
                                    </div>
                                </header>
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
                                    {filtered.map(p => (
                                        <div key={p.id} className="fade-in group glass-card p-4 rounded-[2rem]">
                                            <div className="aspect-[4/5] bg-zinc-950 rounded-[1.5rem] mb-6 overflow-hidden relative cursor-pointer" onClick={() => { setCart([...cart, p]); notify("Añadido"); }}>
                                                <img src={p.image} className="w-full h-full object-cover grayscale group-hover:grayscale-0 transition-all duration-700" alt={p.name} />
                                                <div className="absolute inset-x-0 bottom-4 px-4 translate-y-4 opacity-0 group-hover:translate-y-0 group-hover:opacity-100 transition-all">
                                                    <button className="w-full bg-white text-black py-4 rounded-xl text-[9px] font-black uppercase tracking-widest shadow-xl">Añadir al carrito</button>
                                                </div>
                                            </div>
                                            <div className="px-2 space-y-1">
                                                <div className="flex justify-between items-start">
                                                    <h4 className="font-serif text-2xl italic font-bold text-white tracking-tighter">{p.name}</h4>
                                                    <span className="text-xl font-black text-emerald-500">${p.price}</span>
                                                </div>
                                                <span className="text-[9px] font-black text-zinc-600 uppercase tracking-widest">{p.category}</span>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {view === 'cart' && (
                            <div className="max-w-4xl mx-auto px-6 py-20 fade-in">
                                <h2 className="text-7xl font-serif italic mb-16 tracking-tighter text-center text-white">Tu <span className="text-emerald-500">Bolsa</span></h2>
                                {cart.length === 0 ? (
                                    <div className="text-center py-20 glass-card rounded-[3rem] border-dashed border-zinc-700">
                                        <p className="italic font-serif text-2xl text-zinc-600">No hay productos seleccionados.</p>
                                        <button onClick={() => setView('shop')} className="btn-emerald mt-8">Regresar al menú</button>
                                    </div>
                                ) : (
                                    <div className="grid grid-cols-1 lg:grid-cols-5 gap-12">
                                        <div className="lg:col-span-3 space-y-4">
                                            {cart.map((item, idx) => (
                                                <div key={idx} className="glass-card p-4 rounded-2xl flex gap-6 items-center">
                                                    <img src={item.image} className="w-20 h-20 object-cover rounded-xl shadow-lg" />
                                                    <div className="flex-grow">
                                                        <div className="flex justify-between">
                                                            <h4 className="font-serif text-xl font-bold text-white italic">{item.name}</h4>
                                                            <button onClick={() => setCart(cart.filter((_, i) => i !== idx))} className="text-zinc-700 hover:text-red-500 p-2">&times;</button>
                                                        </div>
                                                        <p className="text-lg font-black text-emerald-500">${item.price}</p>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                        <div className="lg:col-span-2 space-y-6">
                                            <div className="glass-card p-8 rounded-[2rem] space-y-6">
                                                <h3 className="text-xl font-bold text-white border-b border-zinc-800 pb-4">Checkout</h3>
                                                <div className="flex items-center justify-between p-4 bg-zinc-950 rounded-xl border border-zinc-800 cursor-pointer" onClick={() => setIncludeShipping(!includeShipping)}>
                                                    <div className="flex items-center gap-3">
                                                        <div className={`w-4 h-4 rounded border flex items-center justify-center ${includeShipping ? 'bg-emerald-500 border-emerald-500' : 'border-zinc-700'}`}>
                                                            {includeShipping && <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="4"><path d="M20 6L9 17l-5-5"/></svg>}
                                                        </div>
                                                        <span className="text-[10px] font-black uppercase">Incluir Envío</span>
                                                    </div>
                                                    <span className="text-emerald-500 text-xs font-bold">${SHIPPING_COST}</span>
                                                </div>
                                                <div className="flex justify-between items-end border-t border-zinc-800 pt-6">
                                                    <span className="text-[10px] font-black uppercase text-emerald-500">Total a pagar</span>
                                                    <span className="text-5xl font-serif italic font-bold text-white tracking-tighter leading-none">${total}</span>
                                                </div>
                                                <div className="space-y-3 pt-6">
                                                    <button onClick={handlePayPalPayment} className="w-full bg-white text-black py-5 rounded-2xl text-[10px] font-black uppercase tracking-widest hover:bg-zinc-200 transition-all flex items-center justify-center gap-2 shadow-xl shadow-white/5">
                                                        <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M7 2L2 14.5h3.5l1.5-3.5h5.5c3.5 0 6.5-1.5 6.5-5.5s-3-5.5-6.5-5.5H7zm1.5 3h4.5c1.5 0 2.5.5 2.5 2.5s-1 2.5-2.5 2.5H9l-1.5 5h-1.5L8.5 5z"/></svg>
                                                        Pagar con PayPal
                                                    </button>
                                                    <button onClick={() => {
                                                        const text = `Pedido Cannabis Shop:\nVariedades: ${cart.map(i => i.name).join(', ')}\nEnvío: ${includeShipping ? 'Si' : 'No'}\nTotal: $${total}`;
                                                        window.open(`https://wa.me/${WHATSAPP_NUM}?text=${encodeURIComponent(text)}`, '_blank');
                                                    }} className="w-full border border-emerald-500/30 text-emerald-500 py-5 rounded-2xl text-[10px] font-black uppercase tracking-widest hover:bg-emerald-500/10 transition-all">WhatsApp Soporte</button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {view === 'login' && (
                            <div className="max-w-xs mx-auto py-48 text-center space-y-12 fade-in">
                                <h3 className="font-serif text-4xl italic tracking-tighter text-white uppercase font-bold tracking-widest">Acceso Staff</h3>
                                <form onSubmit={handleAdminLogin} className="space-y-6">
                                    <input 
                                        type="password" 
                                        className="w-full bg-transparent border-b-2 border-zinc-900 py-6 text-center text-6xl font-serif tracking-[0.5em] outline-none focus:border-emerald-500 text-emerald-500"
                                        placeholder="••••"
                                        value={pinInput}
                                        onChange={e => setPinInput(e.target.value)}
                                        autoFocus
                                    />
                                    <button className="btn-emerald w-full mt-8">Verificar</button>
                                </form>
                                <button onClick={() => setView('home')} className="text-[9px] text-zinc-700 uppercase font-black">Regresar</button>
                            </div>
                        )}

                        {view === 'admin' && isAdmin && (
                            <div className="max-w-7xl mx-auto px-6 py-16 fade-in">
                                <header className="flex flex-col md:flex-row justify-between items-center mb-20 gap-8 border-b border-zinc-900 pb-12 text-center md:text-left">
                                    <div>
                                        <p className="text-emerald-500 font-black uppercase text-[10px] tracking-widest mb-2">Editor de Inventario</p>
                                        <h2 className="text-5xl md:text-7xl font-serif italic font-bold tracking-tighter text-white uppercase leading-none">Stock</h2>
                                    </div>
                                    <div className="flex gap-4">
                                        <button onClick={() => { setIsAdmin(false); setView('home'); sessionStorage.removeItem('shopAdminAuth'); }} className="px-6 py-4 text-[10px] uppercase font-black text-zinc-600 hover:text-white transition-all">Cerrar</button>
                                        <button onClick={() => setShowAdminModal(true)} className="btn-emerald rounded-2xl shadow-emerald-900/20">Nueva variedad</button>
                                    </div>
                                </header>
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {products.map(p => (
                                        <div key={p.id} className="glass-card p-6 flex gap-6 rounded-[2rem] items-center">
                                            <img src={p.image} className="w-20 h-28 object-cover rounded-2xl bg-zinc-950 shadow-2xl" />
                                            <div className="flex-grow space-y-2">
                                                <h4 className="font-serif text-2xl italic font-bold text-white tracking-tighter leading-none">{p.name}</h4>
                                                <p className="text-[10px] font-black text-emerald-500">${p.price} • {p.category}</p>
                                                <button onClick={async () => {
                                                    if(confirm("¿Eliminar de forma permanente?")) {
                                                        await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('products').doc(p.id).delete();
                                                        notify("Variedad eliminada");
                                                    }
                                                }} className="text-[9px] uppercase font-black text-red-500/20 hover:text-red-500 transition-all">Eliminar</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Modal Admin */}
                    {showAdminModal && (
                        <div className="fixed inset-0 z-[100] bg-[#020202] flex flex-col p-6 md:p-8 overflow-y-auto animate-fade-in">
                            <div className="max-w-2xl mx-auto w-full py-12">
                                <div className="flex justify-between items-center mb-16">
                                    <h2 className="font-serif text-5xl md:text-6xl italic font-bold tracking-tighter text-emerald-500 uppercase">Subir Producto</h2>
                                    <button onClick={() => setShowAdminModal(false)} className="text-5xl font-light text-zinc-800 hover:text-white transition-transform duration-500 hover:rotate-90">&times;</button>
                                </div>
                                <form onSubmit={saveProduct} className="space-y-12">
                                    <div 
                                        className="aspect-video bg-zinc-900/40 border-2 border-dashed border-zinc-800 rounded-[3rem] flex flex-col items-center justify-center cursor-pointer overflow-hidden transition-all hover:border-emerald-500/40 group"
                                        onClick={() => document.getElementById('fileIn').click()}
                                    >
                                        {newProduct.image ? (
                                            <img src={newProduct.image} className="w-full h-full object-cover" />
                                        ) : (
                                            <div className="text-center opacity-30 group-hover:opacity-100 transition-opacity">
                                                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#10b981" strokeWidth="1.5" className="mx-auto mb-4"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
                                                <p className="text-[10px] uppercase font-black text-emerald-500 tracking-widest">Fotografía de la cepa</p>
                                            </div>
                                        )}
                                    </div>
                                    <input id="fileIn" type="file" className="hidden" accept="image/*" onChange={handleImage} />
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-10">
                                        <input className="input-premium w-full text-2xl font-serif italic bg-transparent border-b-2 rounded-none border-x-0 border-t-0 p-0 py-3 border-zinc-800 focus:border-emerald-500 transition-all" placeholder="Variedad / Nombre" value={newProduct.name} onChange={e => setNewProduct({...newProduct, name: e.target.value})} required />
                                        <input type="number" className="input-premium w-full text-2xl font-black bg-transparent border-b-2 rounded-none border-x-0 border-t-0 p-0 py-3 border-zinc-800 text-emerald-500 focus:border-emerald-500 transition-all" placeholder="Precio MXN" value={newProduct.price} onChange={e => setNewProduct({...newProduct, price: e.target.value})} required />
                                        <select className="input-premium w-full uppercase font-black text-[10px] tracking-widest bg-zinc-950 p-4 rounded-xl border border-zinc-800" value={newProduct.category} onChange={e => setNewProduct({...newProduct, category: e.target.value})}>
                                            {CATEGORIES.slice(1).map(c => <option key={c} value={c} className="bg-black">{c}</option>)}
                                        </select>
                                    </div>
                                    <button disabled={isProcessing || !newProduct.image} className="btn-emerald w-full py-8 text-[11px] rounded-[2.5rem] shadow-xl shadow-emerald-900/10">
                                        {isProcessing ? 'Sincronizando...' : 'Publicar Variedad'}
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {notification && (
                        <div className="fixed bottom-12 left-1/2 -translate-x-1/2 bg-white text-black px-12 py-5 text-[9px] font-black uppercase tracking-[0.4em] z-[200] shadow-[0_20px_60px_rgba(0,0,0,0.8)] rounded-full fade-in">
                            {notification}
                        </div>
                    )}

                    <footer className="py-24 text-center bg-[#020202] border-t border-zinc-900 mt-20">
                         <h2 className="font-serif text-3xl font-bold text-white italic uppercase tracking-widest mb-2">CANNABIS<span className="text-emerald-500">SHOP</span></h2>
                         <p className="text-[9px] uppercase tracking-[0.8em] text-zinc-800 font-black">Private • Exclusive • Pure</p>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
